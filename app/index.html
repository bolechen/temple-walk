<meta charset="utf-8">
<title>山门之外 · 云径禅寺</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="src/ui.css">

<div class="view" id="yardView">
  <canvas id="yardGl"></canvas>
  <p id="moodTag" class="fade"></p>
  <p id="goal" class="fade"></p>
  <div id="way" class="fade" aria-hidden="true"><i></i><span></span></div>
  <div id="keys" class="paper" hidden><h2>键位</h2><dl>
    <dt><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></dt><dd>行走</dd><dt><kbd>Shift</kbd></dt><dd>快步</dd>
    <dt><kbd>鼠标</kbd></dt><dd>环顾，点画面握住</dd><dt><kbd>滚轮</kbd></dt><dd>远近</dd>
    <dt><kbd>E</kbd></dt><dd>行事</dd><dt><kbd>V</kbd></dt><dd>换视角</dd>
    <dt><kbd>B</kbd></dt><dd>朱印帐</dd><dt><kbd>P</kbd></dt><dd>留影</dd>
    <dt><kbd>Space</kbd></dt><dd>跳，台沿处下台阶</dd>
    <dt><kbd>T</kbd></dt><dd>时节</dd><dt><kbd>Esc</kbd></dt><dd>松开鼠标，合上，歇脚</dd>
  </dl><p>按 H 收起</p></div>
  <div id="cross"></div>
  <div id="stick"><div id="knob"></div></div>
  <p id="say"></p>
  <button class="ink-btn" id="act" type="button" hidden></button>
  <button class="chip" id="dropBtn" type="button" hidden>下台阶</button>
  <button class="chip" id="jumpBtn" type="button" aria-label="跳">跃</button>
  <div id="breath" hidden><span id="breathWord">吸</span></div>
  <p class="caption" id="hint"></p>
  <div class="rail">
    <button class="chip" id="viewBtn" type="button" aria-label="切换第一视角和第三视角">身外</button>
    <button class="chip" id="moodBtn" type="button" aria-label="选择季节和时辰">时节</button>
    <button class="chip" id="photoBtn" type="button" aria-label="拍照">留影</button>
    <button class="chip" id="bookBtn" type="button" aria-label="打开朱印帐">朱印</button>
    <button class="chip" id="menuBtn" type="button" aria-label="歇脚：设置">歇脚</button>
  </div>
  <dialog class="layer" id="menu" aria-label="歇脚" hidden><div class="card paper">
    <h2>歇脚<span class="seal-mark" aria-hidden="true">云径</span></h2>
    <div class="set"><span>画质</span><div class="opts"><button class="chip" data-q="auto" type="button">自动</button><button class="chip" data-q="low" type="button">简</button><button class="chip" data-q="medium" type="button">中</button><button class="chip" data-q="high" type="button">精</button></div></div>
    <p class="note" id="qualityNote" hidden>画质在下次进山时生效　<button class="chip" id="reloadBtn" type="button">现在重来</button></p>
    <div class="set"><label for="setSens">环顾快慢</label><input id="setSens" type="range" min="0.3" max="2.5" step="0.1"></div>
    <div class="set"><span>上下反转</span><button class="chip" id="setInvert" type="button" aria-pressed="false">关</button></div>
    <div class="set"><label for="setVolume">音量</label><input id="setVolume" type="range" min="0" max="1" step="0.05"></div>
    <div class="set"><label for="setMusic">乐声</label><input id="setMusic" type="range" min="0" max="1" step="0.05"></div>
    <div class="set"><label for="setAmbience">山声</label><input id="setAmbience" type="range" min="0" max="1" step="0.05"></div>
    <div class="set"><label for="setEffects">音效</label><input id="setEffects" type="range" min="0" max="1" step="0.05"></div>
    <div class="row"><button class="chip" id="menuFull" type="button">全屏</button><button class="chip" id="menuKeys" type="button">键位</button><button class="chip" id="menuHome" type="button">回到起点</button><button class="stamp" id="menuResume" type="button">继续</button></div>
  </div></dialog>
  <div id="moodPanel" class="paper" hidden>
    <div><button class="chip" data-season="spring" type="button">春</button><button class="chip" data-season="summer" type="button">夏</button><button class="chip" data-season="autumn" type="button">秋</button><button class="chip" data-season="winter" type="button">冬</button></div>
    <div><button class="chip" data-time="dawn" type="button">晨</button><button class="chip" data-time="day" type="button">昼</button><button class="chip" data-time="dusk" type="button">暮</button><button class="chip" data-time="night" type="button">夜</button></div>
  </div>
  <div id="frame"></div>
  <button class="chip" id="photoClose" type="button">收起</button>
  <div id="photoBar">
    <button class="chip" id="photoSettingsToggle" type="button" aria-expanded="false" aria-controls="photoSettings">设置</button>
    <button id="shutter" type="button" aria-label="按下快门"></button>
  </div>
  <section id="photoSettings" class="paper scrolls" aria-label="拍照设置" hidden>
    <fieldset><legend>画幅</legend><div class="row">
      <button class="chip" data-aspect="screen" aria-pressed="true" type="button">全幅</button><button class="chip" data-aspect="wide" aria-pressed="false" type="button">横幅</button><button class="chip" data-aspect="square" aria-pressed="false" type="button">方幅</button><button class="chip" data-aspect="tall" aria-pressed="false" type="button">竖幅</button>
    </div></fieldset>
    <fieldset><legend>远近</legend><div class="row">
      <button class="chip" data-lens="1" aria-pressed="true" type="button">原景</button><button class="chip" data-lens="1.8" aria-pressed="false" type="button">拉近</button><button class="chip" data-lens="3.2" aria-pressed="false" type="button">特写</button>
    </div></fieldset>
    <fieldset><legend>人物</legend><div class="row">
      <button class="chip" id="monkToggle" aria-pressed="false" type="button">入画</button><button class="chip" id="prayToggle" aria-pressed="false" type="button" disabled>合掌</button>
    </div></fieldset>
    <p>画面就是你眼前所见 · 单击即拍 · 滚轮远近</p>
  </section>
  <dialog class="layer" id="print" aria-label="照片" hidden>
    <img id="printImg" alt="刚拍下的照片">
    <div class="row"><button class="chip" id="shareBtn" type="button" hidden>分享</button><a class="chip" id="saveLink" href="#">保存</a><button class="chip" id="printBack" type="button">返回</button></div>
  </dialog>
</div>
<div id="toast" hidden><img id="toastSeal" alt=""><p id="toastName"></p><p id="toastLine"></p></div>
<dialog class="layer" id="book" aria-label="朱印帐" hidden>
  <img id="bookImg" alt="朱印帐：寺名、日期和已得的印">
  <p id="bookHint"></p>
  <div class="row"><button class="chip" id="bookShare" type="button" hidden>分享</button><a class="chip" id="bookSave" href="#">保存</a><button class="chip" id="bookClose" type="button">合上</button><button class="chip" id="bookReset" type="button">重新朝山</button></div>
</dialog>
<dialog class="layer" id="piece" aria-labelledby="pieceTitle" hidden>
  <figure><img id="pieceImg" alt=""></figure>
  <article class="paper scrolls">
    <h2 id="pieceTitle"></h2><p id="pieceBy"></p>
    <dl id="pieceFacts"></dl>
    <p id="pieceNote"></p><p id="pieceLink"></p><p id="pieceCredit"></p>
    <button class="ink-btn" id="pieceClose" type="button">看过了</button>
  </article>
</dialog>
<dialog class="layer" id="slip" aria-labelledby="slipText" hidden>
  <div class="paper"><p id="slipText"></p><p id="slipFrom"></p><i class="seal-mark" aria-hidden="true">云径</i></div>
  <button class="ink-btn" id="slipTake" type="button">收下</button>
</dialog>
<div id="title">
  <div>
    <h1>山门之外</h1>
    <p class="sub">序章 · 云径禅寺</p>
    <div class="mark">朝<br>山</div>
    <p id="titleSeals"></p>
    <div id="loading" role="status" aria-live="polite" aria-atomic="true">
      <div class="load-copy"><span id="loadLabel">山路正在铺开</span><span id="loadPercent"></span></div>
      <progress id="loadProgress" max="100" aria-label="山路正在铺开"></progress>
      <button id="loadRetry" type="button" hidden>再来一次</button>
    </div>
    <button id="enterBtn" type="button" disabled>山路正在铺开</button>
  </div>
  <p class="how">七处小事 · 七枚朱印</p>
  <button class="chip" id="titleSet" type="button">设置</button>
</div>
<div id="veil"></div>

<script src="loading.js"></script>
<script type="module">
import "./yard.js";

</script>

<meta charset="utf-8">
<title>山门之外 · 云径禅寺</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  /* Layout: two full-viewport views, the courtyard and the hall interior, joined by a fade through darkness. */
  /* Four typefaces, cut down to the characters the temple uses (tools/fonts.py) and kept with the page. */
  @font-face { font-family: "Yunjing Brush"; src: url("f/brush.woff2") format("woff2"); font-display: swap; }

  :root {
    color-scheme: dark; --ink: #0b0a09; --paper: #ede8dc; --ember: #e39a4c; --mist: #c9d3d1; --seal: #b0281c;
    --serif: "Yunjing Serif", "Songti SC", "STSong", serif; --brush: "Yunjing Brush", "STKaiti", "KaiTi", serif;
    --kai: "Yunjing Kai", "STKaiti", "KaiTi", "Yunjing Serif", serif; --line: rgba(237,232,220,.26); --glass: rgba(11,10,9,.38);
  }
  html, body { height: 100%; margin: 0; }
  [hidden] { display: none !important; }
  body { background: var(--ink); color: var(--paper); font-family: var(--serif); overflow: hidden; position: relative; }
  .view { position: absolute; inset: 0; overflow: hidden; }
  #yardGl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  /* What is said about the controls: one line at the foot of the view, there only while it is of use (src/hints.js). */
  .caption {
    position: absolute; left: 0; right: 0; bottom: 0; margin: 0; text-align: center; font: 400 15px/1.9 var(--kai); letter-spacing: .16em;
    padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(30px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    text-shadow: 0 0 10px rgba(0,0,0,.9), 0 0 2px #000; pointer-events: none; opacity: 0; visibility: hidden; transform: translateY(6px);
    transition: opacity 1.2s ease, transform 1.2s ease, visibility 0s 1.2s;
  }
  .caption::before { content: ""; display: block; width: 34px; height: 1px; margin: 0 auto 10px; background: linear-gradient(90deg, transparent, rgba(237,232,220,.7), transparent); }
  .caption.on { opacity: .94; visibility: visible; transform: none; transition: opacity .9s ease, transform .9s ease; }
  .fade { opacity: 0; visibility: hidden; transition: opacity 1.6s ease, visibility 0s 1.6s; }
  .fade.on { opacity: 1; visibility: visible; transition: opacity .9s ease; }

  /* The controls: three small words at the edge, and what they open. The place stays the subject. */
  .rail { position: absolute; right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(64px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; justify-items: end; transition: opacity 1.2s ease; }
  @media (pointer: fine) { body.calm .rail { opacity: 0; } body.held .rail { opacity: 0; pointer-events: none; } .rail:hover, .rail:focus-within { opacity: 1 !important; } }
  .chip {
    font: 400 14px/1 var(--kai); letter-spacing: .32em; text-indent: .32em; color: var(--paper); cursor: pointer;
    background: var(--glass); border: 1px solid var(--line); padding: 11px 13px; border-radius: 3px; min-width: 44px; min-height: 40px;
    -webkit-backdrop-filter: blur(8px) saturate(.8); backdrop-filter: blur(8px) saturate(.8); transition: background .3s ease, border-color .3s ease, color .3s ease;
  }
  .chip:hover { border-color: rgba(237,232,220,.6); background: rgba(11,10,9,.55); }
  .chip[aria-pressed="true"] { background: rgba(227,224,214,.9); color: #14120f; border-color: transparent; }
  .chip:focus-visible, #shutter:focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; }
  #moodTag { position: absolute; left: max(18px, env(safe-area-inset-left, 0px)); top: calc(16px + env(safe-area-inset-top, 0px)); margin: 0; font: 400 13px/1 var(--kai); letter-spacing: .5em; text-shadow: 0 0 8px #000, 0 0 2px #000; pointer-events: none; }
  #moodPanel { position: absolute; right: max(70px, calc(env(safe-area-inset-right, 0px) + 70px)); bottom: calc(64px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; padding: 10px; background: rgba(11,10,9,.5); border: 1px solid rgba(227,224,214,.22); border-radius: 2px; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  #moodPanel > div { display: flex; gap: 6px; }
  /* Photograph mode: everything leaves but the frame and the few things that shape the picture. */
  #frame { position: absolute; border: 1px solid rgba(243,239,229,.75); box-shadow: 0 0 0 200vmax rgba(8,8,7,.3); pointer-events: none; display: none; }
  #photoBar { position: absolute; inset: auto 0 0; display: none; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); pointer-events: none; }
  #photoBar button { pointer-events: auto; }
  #photoSettingsToggle { justify-self: start; min-height: 44px; }
  #shutter { grid-column: 2; width: 58px; height: 58px; border-radius: 50%; border: 2px solid rgba(243,239,229,.9); background: rgba(243,239,229,.92); box-shadow: inset 0 0 0 4px rgba(11,10,9,.85); cursor: pointer; }
  #shutter:disabled { opacity: .4; }
  #photoClose { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); min-height: 44px; display: none; }
  #photoSettings { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(94px + env(safe-area-inset-bottom, 0px)); width: min(308px, calc(100vw - 32px)); max-height: calc(100dvh - 174px); overflow-y: auto; padding: 18px; box-sizing: border-box; background: rgba(16,18,16,.91); border: 1px solid rgba(243,239,229,.22); border-radius: 6px; }
  #photoSettings fieldset { margin: 0 0 14px; padding: 0; border: 0; }
  #photoSettings fieldset:last-of-type { margin-bottom: 0; }
  #photoSettings legend { margin-bottom: 8px; font: 13px/1.5 var(--serif); color: rgba(243,239,229,.65); }
  #photoSettings .row { display: flex; gap: 6px; flex-wrap: wrap; }
  #photoSettings .chip { min-height: 44px; padding: 10px 13px; font-size: 13px; }
  #photoSettings p { margin: 16px 0 0; font: 12px/1.7 var(--serif); color: rgba(243,239,229,.65); }
  body:not(.photo) #photoSettings { display: none; }
  body.photo .rail, body.photo #moodTag, body.photo #hint, body.photo #say, body.photo #dropBtn { display: none; }
  body.photo #frame { display: block; } body.photo #photoBar { display: grid; } body.photo #photoClose { display: block; }
  body.bare .rail, body.bare #moodTag, body.bare #hint { display: none; }
  /* The print, once taken. */
  #print { position: absolute; inset: 0; background: rgba(8,8,7,.92); display: grid; grid-template-rows: 1fr auto; justify-items: center; gap: 14px; padding: calc(18px + env(safe-area-inset-top, 0px)) 16px calc(18px + env(safe-area-inset-bottom, 0px)); }
  #print img { max-width: 100%; max-height: 100%; min-height: 0; object-fit: contain; align-self: center; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
  #print .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #print a.chip { text-decoration: none; display: inline-grid; place-items: center; }

  /* The visit as a pilgrimage: a title to step in from, what there is to do here, the seal that answers it, the book. */
  #title { position: absolute; inset: 0; z-index: 30; display: grid; place-items: center; text-align: center; transition: opacity 1.5s ease;
    background: radial-gradient(ellipse at 50% 42%, rgba(11,10,9,.12), rgba(11,10,9,.6) 75%), linear-gradient(rgba(11,10,9,.05), rgba(11,10,9,.55)); }
  #title.gone { opacity: 0; pointer-events: none; }
  #title h1 { font: 400 clamp(64px, 17vmin, 150px)/1.05 var(--brush); margin: 0; letter-spacing: .08em; text-indent: .08em; color: var(--paper); text-shadow: 0 2px 30px rgba(0,0,0,.6); }
  #title .sub { font: 400 clamp(13px, 2.3vmin, 17px)/1 var(--kai); letter-spacing: .7em; text-indent: .7em; margin: 2.2vmin 0 0; opacity: .82; }
  #title .mark { width: clamp(46px, 9vmin, 76px); aspect-ratio: 1; margin: 5vmin auto 0; background: var(--seal); border-radius: 6%; display: grid; place-items: center; font: clamp(15px, 3.1vmin, 26px)/1.08 "Yunjing Seal", var(--serif); color: #f3ead9; transform: rotate(-3deg); box-shadow: 0 2px 14px rgba(0,0,0,.4); }
  #enterBtn { margin-top: 7vmin; font: 400 clamp(20px, 4vmin, 30px)/1 var(--kai); letter-spacing: .6em; text-indent: .6em; color: var(--paper); background: rgba(11,10,9,.28); border: 1px solid rgba(237,232,220,.5); padding: 16px 34px; border-radius: 3px; cursor: pointer; transition: background .3s, opacity .6s, border-color .3s; }
  #enterBtn:disabled { opacity: .45; cursor: default; font-size: 14px; letter-spacing: .4em; text-indent: .4em; }
  #enterBtn:not(:disabled):hover { background: rgba(237,232,220,.16); }
  #titleSeals { font: 400 14px/1 var(--kai); letter-spacing: .4em; text-indent: .4em; margin: 3vmin 0 0; min-height: 1.3em; color: #e5b9a4; }
  #loading { width: min(280px, 70vw); margin: 24px auto 0; text-align: left; }
  #loading[hidden], #loading [hidden] { display: none; }
  .load-copy { display: flex; justify-content: space-between; gap: 12px; color: var(--paper); opacity: .72; font: 12px/1.6 var(--kai); }
  #loadPercent { font-variant-numeric: tabular-nums; }
  #loadProgress { display: block; width: 100%; height: 3px; margin-top: 10px; border: 0; border-radius: 2px; accent-color: var(--ember); background: rgba(237,232,220,.16); }
  #loadProgress::-webkit-progress-bar { background: rgba(237,232,220,.16); border-radius: 2px; }
  #loadProgress::-webkit-progress-value { background: var(--ember); border-radius: 2px; transition: width .2s ease; }
  #loadProgress::-moz-progress-bar { background: var(--ember); border-radius: 2px; }
  #loadRetry { margin-top: 12px; color: var(--paper); background: transparent; border: 1px solid rgba(237,232,220,.4); padding: 8px 14px; cursor: pointer; font: 14px var(--kai); }
  #title .how { position: absolute; left: 0; right: 0; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); margin: 0; font: 400 13px/1 var(--kai); letter-spacing: .3em; opacity: .6; }
  #goal { position: absolute; left: max(18px, env(safe-area-inset-left, 0px)); top: calc(42px + env(safe-area-inset-top, 0px)); margin: 0; font: 400 18px/1 var(--kai); letter-spacing: .22em; text-shadow: 0 0 8px #000, 0 0 2px #000; pointer-events: none; }
  #goal::before { content: ""; display: inline-block; width: 6px; height: 6px; margin: 0 .9em .15em .1em; background: var(--seal); transform: rotate(45deg); box-shadow: 0 0 6px rgba(0,0,0,.6); }
  #dropBtn { position: absolute; right: 18px; bottom: calc(100px + env(safe-area-inset-bottom, 0px)); z-index: 5; min-height: 44px; }
  #dropBtn kbd { margin-right: 8px; }
  #jumpBtn { position: absolute; right: max(78px, calc(env(safe-area-inset-right, 0px) + 78px)); bottom: calc(40px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; border-radius: 50%; padding: 0; text-indent: 0; letter-spacing: 0; font-size: 17px; z-index: 4; display: none; }
  @media (pointer: coarse) { #jumpBtn { display: block; } }
  body.photo #jumpBtn, body.bare #jumpBtn, body:not(.entered) #jumpBtn { display: none; }
  /* The way to the next place: a small red lozenge on the picture where it lies, or at the edge toward it, with how far. Shown with the goal, and gone with it. */
  #way { position: absolute; left: 0; top: 0; z-index: 3; pointer-events: none; display: grid; justify-items: center; gap: 6px; font: 400 12px/1 var(--kai); letter-spacing: .12em; text-shadow: 0 0 6px #000, 0 0 2px #000; will-change: transform; }
  #way i { width: 9px; height: 9px; background: var(--seal); transform: rotate(45deg); box-shadow: 0 0 0 1px rgba(237,232,220,.55), 0 0 10px rgba(0,0,0,.6); }
  body.photo #way, body.bare #way, body:not(.entered) #way { display: none; }
  #titleSet { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(14px + env(safe-area-inset-top, 0px)); opacity: .7; }
  #act { position: absolute; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); font: 400 22px/1 var(--kai); letter-spacing: .4em; text-indent: .4em; padding: 14px 28px; border-color: rgba(237,232,220,.55); background: rgba(11,10,9,.5); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-radius: 3px; z-index: 5; }
  #say { position: absolute; left: 0; right: 0; bottom: calc(168px + env(safe-area-inset-bottom, 0px)); margin: 0; padding: 0 20px; text-align: center; font: 400 clamp(19px, 3.1vmin, 26px)/1.6 var(--kai); letter-spacing: .18em; text-shadow: 0 0 12px #000, 0 0 3px #000; opacity: 0; transition: opacity 1.4s ease; pointer-events: none; z-index: 6; }
  #say.on { opacity: 1; }
  #toast { position: absolute; left: 50%; top: 24%; transform: translate(-50%, -50%); z-index: 40; display: grid; justify-items: center; gap: 12px; pointer-events: none; opacity: 0; transition: opacity .9s ease; text-align: center; }
  #toast.on { opacity: 1; }
  #toast img { width: clamp(84px, 17vmin, 132px); aspect-ratio: 1; filter: drop-shadow(0 4px 18px rgba(0,0,0,.55)); }
  #toast.on img { animation: press .5s cubic-bezier(.2, 1.5, .4, 1) both; }
  @keyframes press { from { transform: scale(1.6) rotate(-9deg); opacity: 0; } to { transform: scale(1) rotate(-3deg); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { #toast.on img { animation: none; } }
  #toastName { margin: 0; font: 400 14px/1 var(--kai); letter-spacing: .5em; text-indent: .5em; text-shadow: 0 0 8px #000, 0 0 2px #000; }
  #toastLine { margin: 0; max-width: min(86vw, 30em); font: 400 clamp(18px, 3vmin, 24px)/1.65 var(--kai); letter-spacing: .14em; text-shadow: 0 0 10px #000, 0 0 3px #000; }
  #book, #slip { position: absolute; inset: 0; z-index: 35; background: rgba(8,8,7,.9); display: grid; grid-template-rows: 1fr auto auto; justify-items: center; gap: 12px; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
  #book img { max-width: 100%; max-height: 100%; min-height: 0; object-fit: contain; align-self: center; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
  #bookHint { margin: 0; font: 400 15px/1.8 var(--kai); letter-spacing: .14em; text-align: center; max-width: 34em; }
  #book .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #book a.chip { text-decoration: none; display: inline-grid; place-items: center; }
  #bookReset { opacity: .6; }
  #slip { grid-template-rows: 1fr auto; place-items: center; }
  #slip .paper { writing-mode: vertical-rl; background: linear-gradient(#f3eee2, #e8e0cf); color: #1d1a17; padding: 34px 26px; min-height: min(62vh, 520px); max-height: 70vh; box-shadow: 0 10px 40px rgba(0,0,0,.6); border-radius: 1px; display: flex; flex-direction: column; justify-content: space-between; gap: 18px; }
  #slipText { margin: 0; font: 400 clamp(24px, 4.2vmin, 34px)/1.6 var(--kai); letter-spacing: .16em; }
  #slipFrom { margin: 0; font: 400 14px/1.6 var(--kai); letter-spacing: .2em; color: #6b6458; align-self: flex-end; }
  #breath { position: absolute; left: 50%; top: 46%; width: 30vmin; aspect-ratio: 1; margin: -15vmin 0 0 -15vmin; border-radius: 50%; border: 1px solid rgba(237,232,220,.6); display: grid; place-items: center; pointer-events: none; transition: transform 4s ease-in-out, opacity 1s; transform: scale(.55); z-index: 6; }
  #breath[data-phase="in"] { transform: scale(1); } #breath[data-phase="out"] { transform: scale(.55); transition-duration: 5s, 1s; }
  #breathWord { font: 400 5vmin/1 var(--kai); text-shadow: 0 0 10px #000; }
  body.photo #goal, body.photo #act, body.bare #goal, body.bare #act, body.bare #say, body:not(.entered) .rail, body:not(.entered) #goal, body:not(.entered) #hint, body:not(.entered) #moodTag { display: none; }

  /* How it is played: keys shown where a keyboard is likely, a thumb-stick where a finger is. */
  kbd { font: 400 12px/1 var(--serif); display: inline-grid; place-items: center; min-width: 1.75em; height: 1.75em; padding: 0 .45em; margin: 0 .5em 0 0; border: 1px solid rgba(237,232,220,.5); border-radius: 4px; background: rgba(237,232,220,.09); box-shadow: 0 1px 0 rgba(237,232,220,.28); letter-spacing: 0; text-indent: 0; vertical-align: .08em; box-sizing: border-box; }
  kbd + kbd { margin-left: -.25em; }
  #keys { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 20; margin: 0; padding: 26px 34px 20px; background: rgba(11,10,9,.72); border: 1px solid var(--line); border-radius: 4px; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: 0 18px 60px rgba(0,0,0,.45); font: 400 15px/1 var(--kai); letter-spacing: .16em; }
  #keys h2 { margin: 0 0 18px; font: 400 26px/1 var(--brush); letter-spacing: .4em; text-indent: .4em; text-align: center; }
  #keys dl { display: grid; grid-template-columns: auto auto auto auto; gap: 14px 14px; margin: 0; align-items: center; }
  #keys dt { justify-self: end; white-space: nowrap; } #keys dt kbd:last-child { margin-right: 0; } #keys dd { margin: 0 22px 0 0; white-space: nowrap; opacity: .88; } #keys dd:nth-of-type(even) { margin-right: 0; }
  #keys p { margin: 20px 0 0; text-align: center; font-size: 12px; letter-spacing: .3em; opacity: .5; }

  /* The pause menu: the same card as the keys, with the few things a visitor may set. */
  #menu { position: absolute; inset: 0; z-index: 45; display: grid; place-items: center; background: rgba(8,8,7,.28); touch-action: none; }   /* covers the view: nothing behind it is touched while it is open */
  #menu .card { width: min(86vw, 380px); box-sizing: border-box; padding: 26px 30px 22px; background: rgba(11,10,9,.78); border: 1px solid var(--line); border-radius: 4px; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: 0 18px 60px rgba(0,0,0,.45); font: 400 15px/1 var(--kai); letter-spacing: .16em; display: grid; gap: 16px; }
  #menu h2 { margin: 0 0 4px; font: 400 26px/1 var(--brush); letter-spacing: .4em; text-indent: .4em; text-align: center; }
  #menu .set { display: grid; grid-template-columns: 6.2em 1fr; align-items: center; gap: 12px; } #menu .opts { display: flex; gap: 6px; flex-wrap: wrap; } #menu .opts .chip, #menu .set > .chip { padding: 8px 10px; min-height: 34px; min-width: 40px; justify-self: start; }
  #menu input[type=range] { width: 100%; accent-color: var(--ember); } #menu .note { margin: -6px 0 0; font-size: 12px; letter-spacing: .1em; opacity: .8; } #menu .note .chip { padding: 5px 8px; min-height: 0; font-size: 12px; margin-left: .6em; }
  #menu .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; flex-wrap: wrap; } #menu[hidden] { display: none; }
  @media (pointer: coarse) { #menuKeys { display: none; } }
  #cross { position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; margin: -3px 0 0 -3px; border-radius: 50%; background: rgba(237,232,220,.7); box-shadow: 0 0 0 1px rgba(11,10,9,.5); display: none; pointer-events: none; }
  body.held #cross { display: block; }
  #stick { position: absolute; left: max(22px, env(safe-area-inset-left, 0px)); bottom: calc(34px + env(safe-area-inset-bottom, 0px)); width: 118px; height: 118px; border-radius: 50%; border: 1px solid rgba(237,232,220,.34); background: rgba(11,10,9,.22); touch-action: none; display: none; place-items: center; z-index: 4; }
  #knob { width: 50px; height: 50px; border-radius: 50%; background: rgba(237,232,220,.5); border: 1px solid rgba(11,10,9,.4); pointer-events: none; }
  @media (pointer: coarse) { #stick { display: grid; } #keys, #act kbd { display: none; } .caption { bottom: auto; top: calc(78px + env(safe-area-inset-top, 0px)); padding-bottom: 0; font-size: 14px; } }
  body.photo #keys, body.photo #stick, body.photo #cross, body.bare #keys, body.bare #stick, body:not(.entered) #keys, body:not(.entered) #stick { display: none; }

  .ink-btn {
    pointer-events: auto; font: 400 17px/1 var(--kai); letter-spacing: .5em; text-indent: .5em;
    color: var(--paper); background: rgba(11,10,9,.5); border: 1px solid rgba(227,224,214,.4);
    padding: 12px 22px; border-radius: 2px; cursor: pointer;
  }
  .ink-btn:focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; }

  /* The join: eyes close on the way in, daylight floods on the way out. */
  #veil { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .9s ease; }
  #veil.on { opacity: 1; pointer-events: auto; }
  #veil.day { background: var(--mist); }
  #wait { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; letter-spacing: .4em; opacity: 0; transition: opacity .6s ease; pointer-events: none; }
  #wait.on { opacity: .7; }
</style>

<div class="view" id="yardView">
  <canvas id="yardGl"></canvas>
  <p id="moodTag" class="fade"></p>
  <p id="goal" class="fade"></p>
  <div id="way" class="fade" aria-hidden="true"><i></i><span></span></div>
  <div id="keys" hidden><h2>键位</h2><dl>
    <dt><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></dt><dd>行走</dd><dt><kbd>Shift</kbd></dt><dd>快步</dd>
    <dt><kbd>鼠标</kbd></dt><dd>环顾，点画面握住</dd><dt><kbd>滚轮</kbd></dt><dd>远近</dd>
    <dt><kbd>E</kbd></dt><dd>行事</dd><dt><kbd>V</kbd></dt><dd>换视角</dd>

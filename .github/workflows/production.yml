name: Deploy production from a version tag

# Issue #308: the public site is only ever built from a version tag (`vX.Y.Z`), never from main (main goes to the canary,
# pages.yml). Two ways in, one path:
#   - release-please.yml calls this when a version PR is merged and the tag is made (a tag made with the default token starts
#     no workflow of its own, so the release job calls this one by name);
#   - by hand, Actions → this workflow → Run workflow, `ref` a tag: the same build and the same deploy, which is how the live
#     site is put back to an older version (a rollback, docs/RELEASING.md).
# The tag's own code is built, so an older tag goes out as it was when it was good.
on:
  workflow_call:
    inputs:
      ref:
        description: "Version tag to put live, e.g. v0.5.0"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: "Version tag to put live, e.g. v0.5.0 (a rollback is this with an older tag)"
        required: true
        type: string
      check:
        description: "Drive the built page once in a browser before publishing (the boot scenario, about two minutes); untick only in a hurry"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.at.outputs.sha }}
    steps:
      # Only a version tag that exists is put live: not a branch, not a commit.
      - name: The ref is a version tag
        env:
          REF: ${{ inputs.ref }}
        run: |
          echo "$REF" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::ref must be a version tag such as v0.5.0, not '$REF'"; exit 1; }
          git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY" "refs/tags/$REF" || { echo "::error::no tag $REF"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.ref }}
      - id: at
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Caches only read, by prefix: what the tag bakes from is named inside them, so what does not fit is baked again.
      - uses: actions/cache/restore@v4
        with:
          path: node_modules/.cache/walk
          key: walk-t00-production-${{ github.run_id }}
          restore-keys: walk-t00-
      - uses: actions/cache/restore@v4
        with:
          path: node_modules/.cache/doorways
          key: doorways-t00-production-${{ github.run_id }}
          restore-keys: doorways-t00-
      - name: Remember the browser between runs
        if: inputs.check != false
        id: pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-production-${{ hashFiles('pnpm-lock.yaml') }}
      - name: A browser to drive the page with
        if: inputs.check != false
        run: pnpm exec playwright install ${{ steps.pw.outputs.cache-hit == 'true' && ' ' || '--with-deps' }} chromium
      # The only build that carries the visitor counter and may be indexed (app/src/deploy.js). A tag older than this setting
      # ignores it and goes out as it was.
      - name: Build the site
        env:
          VITE_DEPLOY: production
        run: pnpm run build
      - name: End to end, startup and movement
        if: inputs.check != false
        env:
          VITE_DEPLOY: production
        run: node tests/e2e/run.cjs boot
      - name: Keep the report and screenshots
        if: always() && inputs.check != false
        uses: actions/upload-artifact@v4
        with:
          name: production-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: tools/out/
          retention-days: 7
          if-no-files-found: ignore
      - name: Hand the site over for publication
        uses: actions/upload-artifact@v4
        with:
          path: dist
          name: production-site-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One publication of the public site at a time. A run waiting for its turn is replaced by a newer waiting one (GitHub's
    # rule): a run shown as cancelled is run again.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      # The Worker's settings come from the workflow's own branch (main), never from the tag being put live.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: wrangler.production.jsonc
      - uses: actions/download-artifact@v4
        with:
          name: production-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish the demo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npx --yes wrangler@4.162.0 deploy -c wrangler.production.jsonc
      # What is live is read back: the address's first page must be the very page just built.
      - name: The live page is the one built
        env:
          REF: ${{ inputs.ref }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          want=$(sha256sum dist/index.html | cut -c1-64)
          got=none
          for i in 1 2 3 4 5 6; do
            got=$(curl -fsS "https://temple.rushiwowen.co/?live=$GITHUB_RUN_ID" | sha256sum | cut -c1-64) || got=none
            [ "$got" = "$want" ] && break
            sleep 10
          done
          {
            echo "### 线上已换成 \`$REF\`"
            echo "- 提交 \`$SHA\`"
            echo "- index.html SHA-256：构建 \`$want\`，线上 \`$got\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "live=$got"; echo "built=$want"
          [ "$got" = "$want" ]

name: Verify and deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Every push to a pull request, documents too, so that its preview and the comment naming it always follow the head
  # commit (docs/PREVIEWS.md); a path filter here left the comment on an older commit after a push of papers only.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'canary' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Nothing is published that does not parse, pass its unit tests (both walkers), build, and come up in a real browser. Since
  # #296 those run side by side instead of one after the other (`unit`, `grid`, `site`); `verify` is the one check that says
  # all of them passed, and `deploy` waits for it (and, since #308, for `quick`, the stairs and the low drop, by name). The stairs and the low drop are `quick` below and hold the publication up (#308). A push of papers alone is checked in under a minute (DOC_TESTS in
  # tools/ci/changes.cjs, the offline evidence check) and publishes nothing, because there is nothing new to publish.
  #
  # What is the site's, and so what is built and published, is decided here, once, for the jobs below.
  changes:
    permissions:
      contents: read
      pull-requests: read   # to read the preview comment: what the preview is showing now (tools/ci/changes.cjs)
      actions: read         # to read which run last deployed (#296)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      site: ${{ steps.changes.outputs.site }}
      walk: ${{ steps.changes.outputs.walk }}
      unit: ${{ steps.changes.outputs.unit }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/ci
            tools/preview
          sparse-checkout-cone-mode: false
      # A push to main is compared with the last commit whose deploy succeeded, not with the commit before: a run that was
      # cancelled, or replaced in the queue by the next push, leaves nothing deployed, and a papers-only commit after it must not
      # hide the site change before it (#296). A pull request from this repository is compared with the commit whose build its
      # preview is showing (the comment says which), so a pull request that first changes code and then only papers keeps
      # the code's preview, and one whose build failed or was cancelled is built again by the next push.
      - name: Did this push touch the site
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: node tools/ci/changes.cjs

  # The plan, the walker, the building generator, the seasons, on the written plan; and the floor he may stand on.
  unit:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Every script parses, and the typed modules agree with themselves
        if: needs.changes.outputs.unit == 'true'
        run: pnpm run check && pnpm run typecheck
      # Evidence stays out of git (#223): offline only (the store's reachability must never hold up a merge). The
      # network check is `node tools/evidence.mjs verify --all`, run by hand and in the nightly run.
      - name: Evidence folders hold no file over 1 MB, and their manifests are well-formed
        run: node tools/evidence.mjs check
      # Papers alone: only the tests that read papers, each under a second. Nothing else of the suite reads them.
      - name: The tests that read the papers
        if: needs.changes.outputs.unit != 'true'
        run: node --test $(node -p 'require("./tools/ci/changes.cjs").DOC_TESTS.join(" ")')
      # The floor he may stand on (#194): baked from the drawn meshes as a build product (not kept in git), named by the
      # fingerprint of what it is baked from and kept in the cache under it, this commit's and the base's alike (the base is
      # main on a pull request, the commit before on a push to main, built from its own code in .main/). No named place may
      # have become unreachable from where he comes in, on the drawn floor or on the written plan; every part whose
      # reachable floor changed by more than a square metre is listed in the run's summary. A few seconds when both are in
      # the cache; a bake (about a minute each) only for a fingerprint not baked before, that is after a change to what is
      # drawn or to the plan. Before the unit tests, which read the grid, so that the report is in the summary even when they fail.
      - name: Which floor is to be baked, here and on the base
        if: needs.changes.outputs.walk == 'true'
        id: walk
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || '' }}
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          echo "key=$(node tools/bake-walk.mjs --key)" >> "$GITHUB_OUTPUT"
          base=""; name=""
          if [ -n "$BASE_REF" ]; then git fetch --no-tags --depth=1 origin "$BASE_REF" && base=$(git rev-parse FETCH_HEAD) && name=" main"
          elif [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -q '^0*$'; then git fetch --no-tags --depth=1 origin "$BEFORE" && base="$BEFORE" && name="上一个提交"; fi
          basekey=none
          if [ -n "$base" ]; then git worktree add --detach .main "$base" >/dev/null && if [ -f .main/tools/bake-walk.mjs ]; then basekey=$(cd .main && node tools/bake-walk.mjs --key); fi; fi
          echo "base=$basekey" >> "$GITHUB_OUTPUT"; echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Remember baked floors between runs
        if: needs.changes.outputs.walk == 'true'
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/walk
          # One cache for every level's floor (#405): the files in it are named <level>-<fingerprint>.bin, and the key is
          # every level's fingerprint joined (bake-walk.mjs --key). `walk-` also finds the caches saved before #405 under the prologue's name.
          key: walk-${{ steps.walk.outputs.key }}-${{ steps.walk.outputs.base }}
          restore-keys: |
            walk-${{ steps.walk.outputs.key }}-
            walk-
      # A change that is neither the site's nor the floor's still runs the unit tests, which read the baked floor: take it
      # from the newest cache (the same fingerprint as main's, since nothing it is made of has changed) rather than bake it cold.
      - name: Take the newest baked floor, nothing of it having changed
        if: needs.changes.outputs.unit == 'true' && needs.changes.outputs.walk != 'true'
        uses: actions/cache/restore@v4
        with:
          path: node_modules/.cache/walk
          key: walk-unchanged-${{ github.run_id }}
          restore-keys: walk-
      - name: The floor he may stand on, and what this change did to it
        if: needs.changes.outputs.walk == 'true'
        env:
          WALK_BASE_NAME: ${{ steps.walk.outputs.name }}
          KEY: ${{ steps.walk.outputs.key }}
          BASEKEY: ${{ steps.walk.outputs.base }}
        run: |
          node tools/bake-walk.mjs
          if [ "$BASEKEY" != none ]; then (cd .main && WALK_CACHE="$GITHUB_WORKSPACE/node_modules/.cache/walk" node tools/bake-walk.mjs | tail -2); fi
          # Keep only the floors of this commit and of the base, whatever level each is (<level>-<fingerprint>.bin; #405).
          keep=" $(echo "$KEY-$BASEKEY" | tr '-' ' ') "
          for f in node_modules/.cache/walk/*.bin; do [ -e "$f" ] || continue; k=$(basename "$f" .bin); case "$keep" in *" ${k##*-} "*) ;; *) rm -f "$f" ;; esac; done
          # Each level's floor against the base's: a level the base has no floor for is checked for reach alone.
          status=0
          for lv in $(node tools/bake-walk.mjs --list); do node tools/walk-diff.mjs ".main/app/shared/walk/$lv.bin" --level="$lv" --png="tools/out/walk-diff/$lv" || status=1; done
          exit $status

  # The floor he may stand on, baked once for the whole run (#442): the ten test shards used to restore or bake it each, which on a
  # change to what is drawn was ten bakes of two minutes at once (and twenty seconds each to find it in the cache even when
  # it was there). It is baked (or restored from the cache `unit` keeps) here, handed on as an artifact, and the shards take it
  # as it is: every test that needs the floor to be fresh still checks it (`ensure` in tools/bake-walk.mjs) and would bake again
  # if it were not, so a wrong floor cannot be taken for a right one.
  floor:
    needs: changes
    if: needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
        with:
          floor: ${{ needs.changes.outputs.walk }}
      - name: The floor, from the cache or baked
        run: node tools/bake-walk.mjs
      - name: Hand the floor on to the test shards
        uses: actions/upload-artifact@v4
        with:
          name: floor-${{ github.run_id }}
          path: app/shared/walk/*.bin
          retention-days: 1
          overwrite: true
          if-no-files-found: error

  # The unit tests (the plan, the walker, the building generator, the seasons) shared among four machines (#442, #697): every
  # tests/unit/*.test.mjs on exactly one of them, by the seconds in tests/unit/durations.json (tools/ci/unit-shard.cjs;
  # tests/unit/ci-changes.test.mjs holds that none is left out or run twice). Together they are what `pnpm test` runs.
  tests:
    needs: [changes, floor]
    if: needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
        with:
          floor: ${{ needs.changes.outputs.walk }}
      # The tests read the baked floor: the one the `floor` job baked for this commit, taken as it is.
      - name: The floor, from the `floor` job
        uses: actions/download-artifact@v4
        with:
          name: floor-${{ github.run_id }}
          path: app/shared/walk
      - name: Unit tests, this machine's share
        run: node tools/ci/unit-shard.cjs run ${{ matrix.shard }}/5

  # The same unit tests on the walker over the baked floor (#265), beside the first set, not after it, shared the same way.
  grid:
    needs: [changes, floor]
    if: needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
        with:
          floor: ${{ needs.changes.outputs.walk }}
      # The swapped walker reads the floor in app/shared/walk/: the one the `floor` job baked for this commit, taken as it is.
      - name: The floor, from the `floor` job
        uses: actions/download-artifact@v4
        with:
          name: floor-${{ github.run_id }}
          path: app/shared/walk
      - name: The same unit tests on the walker over the baked floor (#265), this machine's share
        run: WALKER=mesh node tools/ci/unit-shard.cjs run ${{ matrix.shard }}/5 --import ./tools/walk/swap.mjs

  # The site as the browser gets it: built once, and the very same dist/ driven through by `quick` and handed on for publication
  # or the preview.
  build:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Where this build is going (app/src/deploy.js): a pull request's preview, or the canary. Never production: that is
      # built from a version tag by deploy-tag.yml. Neither carries the visitor counter.
      VITE_DEPLOY: ${{ github.event_name == 'pull_request' && 'preview' || 'canary' }}
      # The pull request's number, for a preview build to say which it is (#310 reads it; empty on the canary).
      VITE_PR: ${{ github.event.pull_request.number }}
      # The commit the page was built from: a pull request's own head, not the merge commit GITHUB_SHA names there.
      VITE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
        with:
          floor: ${{ needs.changes.outputs.walk }}
      # The browser comes before the build: the rooms seen through the doors (#218) are drawn in the built site, in Chromium
      # with software rendering, for any hall whose fingerprint is not in the cache (tools/bake-doorways.mjs).
      - name: Remember the browser between runs
        id: pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.63.0-chromium
      - name: A browser to drive the page with
        run: pnpm exec playwright install ${{ steps.pw.outputs.cache-hit == 'true' && ' ' || '--with-deps' }} chromium
      - name: Which doorways are to be drawn
        id: doorways
        run: echo "key=$(node tools/bake-doorways.mjs --key)" >> "$GITHUB_OUTPUT"
      - name: Remember drawn doorways between runs
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/doorways
          key: doorways-${{ steps.doorways.outputs.key }}
          restore-keys: doorways-
      - name: Build the site
        run: pnpm run build
      # Built once for the whole run (#442 step 3): `site`, `quick` and, after `verify`, the preview or the canary all take these
      # very files, so what `boot` and the stairs were driven through is what is published. Named by the run only: re-running
      # the failed jobs finds it, and a whole re-run overwrites it.
      - name: Hand the built site to the jobs that drive it
        uses: actions/upload-artifact@v4
        with:
          path: dist
          name: built-site-${{ github.run_id }}
          retention-days: 1
          overwrite: true
          include-hidden-files: true

  # What starting up, walking and the camera break most often, run before the site goes out and not beside it (#308) on the one
  # site `build` made: `boot` (the page comes up clean and draws) and the stairs and the low drop, four machines side by side
  # (#442: `boot` no longer waits for the others, nor each machine builds its own copy). Only when the site is built at all.
  # `e2e.yml`'s regression run no longer repeats them.
  quick:
    needs: [changes, build]
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: boot, scenarios: "boot" }
          - { name: drop-touch, scenarios: "drop-touch" }
          - { name: drop, scenarios: "drop" }
          - { name: stairs, scenarios: "stairs stairs-edge" }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
        with:
          floor: ${{ needs.changes.outputs.walk }}
      - uses: actions/download-artifact@v4
        with:
          name: built-site-${{ github.run_id }}
          path: dist
      # tools/site.cjs rebuilds a dist/ older than anything in app/; this checkout is newer than the build that made it, so say
      # that the stamp is the site as it should be.
      - name: The site is built, whatever the checkout's date
        run: touch dist/.built
      - name: Remember the browser between runs
        id: pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.63.0-chromium
      - name: A browser to drive the page with
        run: pnpm exec playwright install ${{ steps.pw.outputs.cache-hit == 'true' && ' ' || '--with-deps' }} chromium
      - name: The scenario, on the built site
        run: node tests/e2e/run.cjs ${{ matrix.scenarios }}
      - name: Keep the report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-quick-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: tools/out/
          retention-days: 7
          if-no-files-found: ignore

  # The Worker behind 同修留痕 (#340), run for real on this machine (workerd, a Durable Object on local SQLite): never Cloudflare.
  # It needs only node; the page is not built for it.
  worker:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            worker
            tools/worker-smoke.mjs
            wrangler.canary.jsonc
            app/src
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The canary's Worker answers the API as it should (the public site's is the same script and binding, held equal by tests/unit/trace.test.mjs)
        run: node tools/worker-smoke.mjs wrangler.canary.jsonc

  # The one check that all of them passed (the name a branch rule may require, as before). A job skipped because nothing
  # called for it is fine; one that failed, was cancelled, or never ran because `changes` did not is not.
  verify:
    needs: [changes, unit, floor, build, tests, grid, quick, worker]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      site: ${{ needs.changes.outputs.site }}
    steps:
      - name: Everything that was asked for passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | node -e 'const n=JSON.parse(require("fs").readFileSync(0,"utf8"));const bad=Object.entries(n).filter(([k,v])=>v.result==="failure"||v.result==="cancelled"||(k==="changes"&&v.result!=="success"));for(const [k,v] of Object.entries(n))console.log(k,v.result);if(bad.length){console.log("not passed:",bad.map(x=>x[0]).join(", "));process.exit(1)}'

  preview:
    # Runs after verify whatever it concluded, so a failed check is said on the pull request too; a run cancelled by a
    # newer push says nothing, because the newer run will.
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (needs.verify.result == 'success' || needs.verify.result == 'failure')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            wrangler.jsonc
            tools/preview
            docs/t00/camera-manifest.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        if: needs.verify.result == 'success' && needs.verify.outputs.site == 'true'
        with:
          name: built-site-${{ github.run_id }}
          path: dist
      - uses: actions/setup-node@v4
        if: needs.verify.result == 'success' && needs.verify.outputs.site == 'true'
        with:
          node-version: 22
      - name: Upload the preview
        id: upload
        if: needs.verify.result == 'success' && needs.verify.outputs.site == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: npx --yes wrangler@4.162.0 preview --name "pr-$PR" --ignore-base-config --tag "${SHA:0:7}" --message "$SHA"
      - name: Say where it is on the pull request
        if: always()
        uses: actions/github-script@v7
        env:
          # `same`: checked, and nothing of the site changed since the build the preview shows, so nothing was built or uploaded.
          STATE: ${{ needs.verify.result == 'success' && needs.verify.outputs.site != 'true' && 'same' || (steps.upload.outcome == 'success' && 'success' || 'failure') }}
          SHA: ${{ github.event.pull_request.head.sha }}
          OUTPUT_FILE: ${{ runner.temp }}/wrangler-output.ndjson
        with:
          script: await require(`${process.env.GITHUB_WORKSPACE}/tools/preview/comment.cjs`)({ github, context, core })

  # The canary (#308): what main last deployed, on a Worker of its own with its own address, so that it can be played before
  # a version is cut. The public site is deployed from a version tag (deploy-tag.yml). Only after `verify`: both sets of unit
  # tests, the build and `boot` have all passed, and after `quick` (the stairs and the low drop), by name; a skipped or
  # failed job fails the `success()` every `if` without a status function carries.
  deploy:
    if: github.event_name != 'pull_request' && needs.verify.outputs.site == 'true'
    needs: [verify, quick]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            wrangler.canary.jsonc
            worker
            app/src
      - uses: actions/download-artifact@v4
        with:
          name: built-site-${{ github.run_id }}
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish the canary
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        # pipefail: a failed deploy must fail the job, not be hidden by the `tee` after it
        shell: bash
        run: npx --yes wrangler@4.162.0 deploy -c wrangler.canary.jsonc | tee "$RUNNER_TEMP/deploy.txt"
      - name: Say where it is
        run: |
          url=$(grep -Eo 'https://temple-walk-canary[^ ]*workers\.dev' "$RUNNER_TEMP/deploy.txt" | head -1)
          { echo "### canary"; echo "- 地址：${url:-（未从 wrangler 输出读到）}"; echo "- 提交 \`$GITHUB_SHA\`"; } >> "$GITHUB_STEP_SUMMARY"

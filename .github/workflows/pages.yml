name: Verify and deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Every push to a pull request, documents too, so that its preview and the comment naming it always follow the head
  # commit (docs/PREVIEWS.md); a path filter here left the comment on an older commit after a push of papers only.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Nothing is published that does not parse, pass its unit tests, build, and come up in a real browser. That is all that
  # stands between a push and the site: the slower scenarios (the stairs, the low drop) run beside this
  # in e2e.yml and do not hold the publication up. A push that touches nothing the site is made of (documents,
  # delivery papers) is checked in half a minute and publishes nothing, because there is nothing new to publish.
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      site: ${{ steps.changes.outputs.site }}
    steps:
      - uses: actions/checkout@v4
      - name: Did this push touch the site
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          site=true
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -q '^0*$'; then
            if files=$(gh api "repos/${{ github.repository }}/compare/$BEFORE...${{ github.sha }}" --jq '.files[].filename' 2>/dev/null) && [ -n "$files" ] && [ "$(echo "$files" | wc -l)" -lt 300 ]; then
              echo "$files" | grep -qE '^(app/|tests/e2e/|package\.json$|pnpm-lock\.yaml$|vite\.config\.mjs$|wrangler\.production\.jsonc$|tools/(setup\.mjs|site\.cjs)$|\.github/workflows/pages\.yml$)' || site=false
            fi
          fi
          echo "site=$site" >> "$GITHUB_OUTPUT"; echo "site changed: $site"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Every script parses, and the typed modules agree with themselves
        run: pnpm run check && pnpm run typecheck
      # The floor he may stand on (#194): baked from the drawn meshes as a build product (not kept in git), named by the
      # fingerprint of what it is baked from and kept in the cache under it, this commit's and the base's alike (the base is
      # main on a pull request, the commit before on a push to main, built from its own code in .main/). No named place may
      # have become unreachable from where he comes in, on the drawn floor or on the written plan; every part whose
      # reachable floor changed by more than a square metre is listed in the run's summary. A few seconds when both are in
      # the cache; a bake (about a minute each) only for a fingerprint not baked before, that is after a change to what is
      # drawn or to the plan. Before the unit tests, which read the grid, so that the report is in the summary even when they fail.
      - name: Which floor is to be baked, here and on the base
        id: walk
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || '' }}
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          echo "key=$(node tools/bake-walk.mjs --key)" >> "$GITHUB_OUTPUT"
          base=""; name=""
          if [ -n "$BASE_REF" ]; then git fetch --no-tags --depth=1 origin "$BASE_REF" && base=$(git rev-parse FETCH_HEAD) && name=" main"
          elif [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -q '^0*$'; then git fetch --no-tags --depth=1 origin "$BEFORE" && base="$BEFORE" && name="上一个提交"; fi
          basekey=none
          if [ -n "$base" ]; then git worktree add --detach .main "$base" >/dev/null && if [ -f .main/tools/bake-walk.mjs ]; then basekey=$(cd .main && node tools/bake-walk.mjs --key); fi; fi
          echo "base=$basekey" >> "$GITHUB_OUTPUT"; echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Remember baked floors between runs
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/walk
          key: walk-t00-${{ steps.walk.outputs.key }}-${{ steps.walk.outputs.base }}
          restore-keys: |
            walk-t00-${{ steps.walk.outputs.key }}-
            walk-t00-
      - name: The floor he may stand on, and what this change did to it
        env:
          WALK_BASE_NAME: ${{ steps.walk.outputs.name }}
          KEY: ${{ steps.walk.outputs.key }}
          BASEKEY: ${{ steps.walk.outputs.base }}
        run: |
          node tools/bake-walk.mjs
          if [ "$BASEKEY" != none ]; then (cd .main && WALK_CACHE="$GITHUB_WORKSPACE/node_modules/.cache/walk" node tools/bake-walk.mjs | tail -2); fi
          find node_modules/.cache/walk -name '*.bin' ! -name "t00-$KEY.bin" ! -name "t00-$BASEKEY.bin" -delete
          node tools/walk-diff.mjs .main/app/shared/walk/t00.bin --png=tools/out/walk-diff
      - name: Unit tests (the plan, the walker, the building generator, the seasons)
        run: pnpm test
      - name: Build the site
        if: steps.changes.outputs.site == 'true'
        run: pnpm run build
      - name: Remember the browser between runs
        if: steps.changes.outputs.site == 'true'
        id: pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.63.0-chromium
      - name: A browser to drive the page with
        if: steps.changes.outputs.site == 'true'
        run: pnpm exec playwright install ${{ steps.pw.outputs.cache-hit == 'true' && ' ' || '--with-deps' }} chromium
      - name: End to end, startup and movement
        if: steps.changes.outputs.site == 'true'
        run: node tests/e2e/run.cjs boot
      - name: Keep the report and screenshots
        if: always() && steps.changes.outputs.site == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-quick-${{ github.run_id }}-${{ github.run_attempt }}
          path: tools/out/
          retention-days: 7
          if-no-files-found: ignore
      # The site is what Vite built into dist/, the same files the browser above was just driven through.
      - name: Hand the site over for publication
        if: github.event_name != 'pull_request' && steps.changes.outputs.site == 'true'
        uses: actions/upload-artifact@v4
        with:
          path: dist
          name: production-site-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          include-hidden-files: true
      # A pull request from this repository gets its own preview (docs/PREVIEWS.md): the same dist/ that was just driven
      # through, handed to the preview job. Pull requests from forks have no access to the Cloudflare token and get none.
      - name: Hand the site over for the pull request's preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          path: dist
          name: preview-site-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          include-hidden-files: true

  preview:
    # Runs after verify whatever it concluded, so a failed check is said on the pull request too; a run cancelled by a
    # newer push says nothing, because the newer run will.
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.verify.result != 'cancelled'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            wrangler.jsonc
            tools/preview
            docs/t00/camera-manifest.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        if: needs.verify.result == 'success'
        with:
          name: preview-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - uses: actions/setup-node@v4
        if: needs.verify.result == 'success'
        with:
          node-version: 22
      - name: Upload the preview
        id: upload
        if: needs.verify.result == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: npx --yes wrangler@4.162.0 preview --name "pr-$PR" --ignore-base-config --tag "${SHA:0:7}" --message "$SHA"
      - name: Say where it is on the pull request
        if: always()
        uses: actions/github-script@v7
        env:
          STATE: ${{ steps.upload.outcome == 'success' && 'success' || 'failure' }}
          SHA: ${{ github.event.pull_request.head.sha }}
          OUTPUT_FILE: ${{ runner.temp }}/wrangler-output.ndjson
        with:
          script: await require(`${process.env.GITHUB_WORKSPACE}/tools/preview/comment.cjs`)({ github, context, core })

  deploy:
    if: github.event_name != 'pull_request' && needs.verify.outputs.site == 'true'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: wrangler.production.jsonc
      - uses: actions/download-artifact@v4
        with:
          name: production-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish the demo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npx --yes wrangler@4.162.0 deploy -c wrangler.production.jsonc

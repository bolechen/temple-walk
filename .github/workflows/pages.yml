name: Verify and deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Every push to a pull request, documents too, so that its preview and the comment naming it always follow the head
  # commit (docs/PREVIEWS.md); a path filter here left the comment on an older commit after a push of papers only.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Nothing is published that does not parse, pass its unit tests (both walkers), build, and come up in a real browser. Since
  # #296 those run side by side instead of one after the other (`unit`, `grid`, `site`); `verify` is the one check that says
  # all of them passed, and `deploy` waits for it. The slower scenarios (the stairs, the low drop) run beside this in
  # e2e.yml and do not hold the publication up. A push of papers alone is checked in under a minute (DOC_TESTS in
  # tools/ci/changes.cjs, the offline evidence check) and publishes nothing, because there is nothing new to publish.
  #
  # What is the site's, and so what is built and published, is decided here, once, for the jobs below.
  changes:
    permissions:
      contents: read
      pull-requests: read   # to read the preview comment: what the preview is showing now (tools/ci/changes.cjs)
      actions: read         # to read which run last deployed (#296)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      site: ${{ steps.changes.outputs.site }}
      walk: ${{ steps.changes.outputs.walk }}
      unit: ${{ steps.changes.outputs.unit }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/ci
            tools/preview
          sparse-checkout-cone-mode: false
      # A push to main is compared with the last commit whose deploy succeeded, not with the commit before: a run that was
      # cancelled, or replaced in the queue by the next push, leaves nothing deployed, and a papers-only commit after it must not
      # hide the site change before it (#296). A pull request from this repository is compared with the commit whose build its
      # preview is showing (the comment says which), so a pull request that first changes code and then only papers keeps
      # the code's preview, and one whose build failed or was cancelled is built again by the next push.
      - name: Did this push touch the site
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: node tools/ci/changes.cjs

  # The plan, the walker, the building generator, the seasons, on the written plan; and the floor he may stand on.
  unit:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Every script parses, and the typed modules agree with themselves
        if: needs.changes.outputs.unit == 'true'
        run: pnpm run check && pnpm run typecheck
      # Evidence stays out of git (#223): offline only (the store's reachability must never hold up a merge). The
      # network check is `node tools/evidence.mjs verify --all`, run by hand and in the nightly run.
      - name: Evidence folders hold no file over 1 MB, and their manifests are well-formed
        run: node tools/evidence.mjs check
      # Papers alone: only the tests that read papers, each under a second. Nothing else of the suite reads them.
      - name: The tests that read the papers
        if: needs.changes.outputs.unit != 'true'
        run: node --test $(node -p 'require("./tools/ci/changes.cjs").DOC_TESTS.join(" ")')
      # The floor he may stand on (#194): baked from the drawn meshes as a build product (not kept in git), named by the
      # fingerprint of what it is baked from and kept in the cache under it, this commit's and the base's alike (the base is
      # main on a pull request, the commit before on a push to main, built from its own code in .main/). No named place may
      # have become unreachable from where he comes in, on the drawn floor or on the written plan; every part whose
      # reachable floor changed by more than a square metre is listed in the run's summary. A few seconds when both are in
      # the cache; a bake (about a minute each) only for a fingerprint not baked before, that is after a change to what is
      # drawn or to the plan. Before the unit tests, which read the grid, so that the report is in the summary even when they fail.
      - name: Which floor is to be baked, here and on the base
        if: needs.changes.outputs.walk == 'true'
        id: walk
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || '' }}
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          echo "key=$(node tools/bake-walk.mjs --key)" >> "$GITHUB_OUTPUT"
          base=""; name=""
          if [ -n "$BASE_REF" ]; then git fetch --no-tags --depth=1 origin "$BASE_REF" && base=$(git rev-parse FETCH_HEAD) && name=" main"
          elif [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -q '^0*$'; then git fetch --no-tags --depth=1 origin "$BEFORE" && base="$BEFORE" && name="上一个提交"; fi
          basekey=none
          if [ -n "$base" ]; then git worktree add --detach .main "$base" >/dev/null && if [ -f .main/tools/bake-walk.mjs ]; then basekey=$(cd .main && node tools/bake-walk.mjs --key); fi; fi
          echo "base=$basekey" >> "$GITHUB_OUTPUT"; echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Remember baked floors between runs
        if: needs.changes.outputs.walk == 'true'
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/walk
          key: walk-t00-${{ steps.walk.outputs.key }}-${{ steps.walk.outputs.base }}
          restore-keys: |
            walk-t00-${{ steps.walk.outputs.key }}-
            walk-t00-
      # A change that is neither the site's nor the floor's still runs the unit tests, which read the baked floor: take it
      # from the newest cache (the same fingerprint as main's, since nothing it is made of has changed) rather than bake it cold.
      - name: Take the newest baked floor, nothing of it having changed
        if: needs.changes.outputs.unit == 'true' && needs.changes.outputs.walk != 'true'
        uses: actions/cache/restore@v4
        with:
          path: node_modules/.cache/walk
          key: walk-t00-unchanged-${{ github.run_id }}
          restore-keys: walk-t00-
      - name: The floor he may stand on, and what this change did to it
        if: needs.changes.outputs.walk == 'true'
        env:
          WALK_BASE_NAME: ${{ steps.walk.outputs.name }}
          KEY: ${{ steps.walk.outputs.key }}
          BASEKEY: ${{ steps.walk.outputs.base }}
        run: |
          node tools/bake-walk.mjs
          if [ "$BASEKEY" != none ]; then (cd .main && WALK_CACHE="$GITHUB_WORKSPACE/node_modules/.cache/walk" node tools/bake-walk.mjs | tail -2); fi
          find node_modules/.cache/walk -name '*.bin' ! -name "t00-$KEY.bin" ! -name "t00-$BASEKEY.bin" -delete
          node tools/walk-diff.mjs .main/app/shared/walk/t00.bin --png=tools/out/walk-diff
      - name: Unit tests (the plan, the walker, the building generator, the seasons)
        if: needs.changes.outputs.unit == 'true'
        run: pnpm test

  # The same unit tests on the walker over the baked floor (#265), beside the first set, not after it.
  grid:
    needs: changes
    if: needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
        with:
          floor: ${{ needs.changes.outputs.walk }}
      # Writes the floor into app/shared/walk/ from the cache (a few seconds), or bakes it; the swapped walker reads that file.
      - name: The floor, from the cache or baked
        run: node tools/bake-walk.mjs
      - name: The same unit tests on the walker over the baked floor (#265)
        run: WALKER=court node --import ./tools/walk/swap.mjs --test tests/unit/*.test.mjs

  # The site as the browser gets it: built once, driven through once, and the very same dist/ handed on for publication or the
  # preview.
  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
        with:
          floor: ${{ needs.changes.outputs.walk }}
      # The browser comes before the build: the rooms seen through the doors (#218) are drawn in the built site, in Chromium
      # with software rendering, for any hall whose fingerprint is not in the cache (tools/bake-doorways.mjs).
      - name: Remember the browser between runs
        id: pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.63.0-chromium
      - name: A browser to drive the page with
        run: pnpm exec playwright install ${{ steps.pw.outputs.cache-hit == 'true' && ' ' || '--with-deps' }} chromium
      - name: Which doorways are to be drawn
        id: doorways
        run: echo "key=$(node tools/bake-doorways.mjs --key)" >> "$GITHUB_OUTPUT"
      - name: Remember drawn doorways between runs
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/doorways
          key: doorways-t00-${{ steps.doorways.outputs.key }}
          restore-keys: doorways-t00-
      - name: Build the site
        run: pnpm run build
      - name: End to end, startup and movement
        run: node tests/e2e/run.cjs boot
      - name: Keep the report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-quick-${{ github.run_id }}-${{ github.run_attempt }}
          path: tools/out/
          retention-days: 7
          if-no-files-found: ignore
      # The site is what Vite built into dist/, the same files the browser above was just driven through.
      - name: Hand the site over for publication
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          path: dist
          name: production-site-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          include-hidden-files: true
      # A pull request from this repository gets its own preview (docs/PREVIEWS.md): the same dist/ that was just driven
      # through, handed to the preview job. Pull requests from forks have no access to the Cloudflare token and get none.
      - name: Hand the site over for the pull request's preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          path: dist
          name: preview-site-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          include-hidden-files: true

  # The one check that all of them passed (the name a branch rule may require, as before). A job skipped because nothing
  # called for it is fine; one that failed, was cancelled, or never ran because `changes` did not is not.
  verify:
    needs: [changes, unit, grid, site]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      site: ${{ needs.changes.outputs.site }}
    steps:
      - name: Everything that was asked for passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | node -e 'const n=JSON.parse(require("fs").readFileSync(0,"utf8"));const bad=Object.entries(n).filter(([k,v])=>v.result==="failure"||v.result==="cancelled"||(k==="changes"&&v.result!=="success"));for(const [k,v] of Object.entries(n))console.log(k,v.result);if(bad.length){console.log("not passed:",bad.map(x=>x[0]).join(", "));process.exit(1)}'

  preview:
    # Runs after verify whatever it concluded, so a failed check is said on the pull request too; a run cancelled by a
    # newer push says nothing, because the newer run will.
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (needs.verify.result == 'success' || needs.verify.result == 'failure')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            wrangler.jsonc
            tools/preview
            docs/t00/camera-manifest.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        if: needs.verify.result == 'success' && needs.verify.outputs.site == 'true'
        with:
          name: preview-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - uses: actions/setup-node@v4
        if: needs.verify.result == 'success' && needs.verify.outputs.site == 'true'
        with:
          node-version: 22
      - name: Upload the preview
        id: upload
        if: needs.verify.result == 'success' && needs.verify.outputs.site == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: npx --yes wrangler@4.162.0 preview --name "pr-$PR" --ignore-base-config --tag "${SHA:0:7}" --message "$SHA"
      - name: Say where it is on the pull request
        if: always()
        uses: actions/github-script@v7
        env:
          # `same`: checked, and nothing of the site changed since the build the preview shows, so nothing was built or uploaded.
          STATE: ${{ needs.verify.result == 'success' && needs.verify.outputs.site != 'true' && 'same' || (steps.upload.outcome == 'success' && 'success' || 'failure') }}
          SHA: ${{ github.event.pull_request.head.sha }}
          OUTPUT_FILE: ${{ runner.temp }}/wrangler-output.ndjson
        with:
          script: await require(`${process.env.GITHUB_WORKSPACE}/tools/preview/comment.cjs`)({ github, context, core })

  # Only after `verify`: both sets of unit tests, the build and `boot` have all passed (a skipped or failed job fails the
  # `success()` every `if` without a status function carries).
  deploy:
    if: github.event_name != 'pull_request' && needs.verify.outputs.site == 'true'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: wrangler.production.jsonc
      - uses: actions/download-artifact@v4
        with:
          name: production-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish the demo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npx --yes wrangler@4.162.0 deploy -c wrangler.production.jsonc

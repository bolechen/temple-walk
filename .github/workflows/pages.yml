name: Verify and deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Notes, tests and tools do not change what is published.
    paths: ["app/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Nothing is published that does not parse, pass its unit tests, and come up in a real browser.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Every script parses
        run: npm run check
      - name: Unit tests (the plan, the walker, the building generator, the seasons)
        run: npm test
      - name: Remember the browser between runs
        id: pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.63.0-chromium
      - name: A browser to drive the page with
        run: npm install --no-save playwright@1.63.0 && npx playwright install ${{ steps.pw.outputs.cache-hit == 'true' && ' ' || '--with-deps' }} chromium
      - name: End to end, the quick tier (the page comes up clean and draws)
        run: npm run e2e:quick
      - name: Keep the report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-quick-${{ github.run_id }}-${{ github.run_attempt }}
          path: tools/out/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The site is the app folder as it is: no build step.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

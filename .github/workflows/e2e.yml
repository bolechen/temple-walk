name: End to end, every scenario

# The whole suite takes the better part of an hour on one machine without a GPU, so it does not run on every push:
# once a night (the owner, 2026-11-17: a scenario was red on main for days because only the weekly run walked it, #149), and whenever it is asked for (Actions → this workflow → Run workflow), shared among as many machines as the list needs (twelve at present, `shards` below) by each scenario's measured time (tests/e2e/shards.cjs, #335, #376), or, asked for by hand with `runner: t4`, among four Hugging Face Jobs on a T4 (the `t4` jobs below).
on:
  # Beside every publication, and not in its way: his body and the camera's near plane against everything built, and the
  # pause menu in every language. (The stairs and the low drop, which change most often, stop the publication itself since
  # #308: `quick` in pages.yml.) The photograph's interface (photo-ui, several minutes on its own) breaks only when the
  # photograph is changed; it waits for the nightly run or a run asked for by hand.
  push:
    branches: [main]
    paths: ["app/**", "tests/e2e/**", "package.json", "pnpm-lock.yaml", "vite.config.mjs", "tools/site.cjs", "tools/bake-doorways.mjs"]
  workflow_dispatch:
    inputs:
      scenarios:
        description: "Scenario names separated by spaces, or --smoke; empty runs them all"
        required: false
        default: ""
      evidence:
        description: "Also read the evidence over the network and compare hashes (always done by the nightly run)"
        type: boolean
        default: false
      runner:
        description: "Where the scenarios are walked: github (twelve free machines, software drawing) or t4 (four Hugging Face Jobs on a T4 card; needs the HF_TOKEN secret, #335)"
        type: choice
        options: [github, t4]
        default: github
  schedule:
    - cron: "17 19 * * *"

permissions:
  contents: read

concurrency:
  # A full run on a branch keeps to its own branch: it must not cancel the nightly run of main (#335).
  group: e2e-${{ github.event_name == 'push' && 'regression' || format('full-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  # Beside every publication: what a push most often breaks and the publication's own checks do not walk. The parse,
  # type and unit checks are not repeated here: "Verify and deploy" runs them on the same commit and is what stands
  # between a push and the site.
  regression:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: His whole body fits everywhere his feet may go
        run: pnpm run edges
      - name: The camera's near plane cuts into nothing
        run: pnpm run nearplane
      - name: The same two on the walker over the baked floor (#265)
        run: pnpm run edges:grid && pnpm run nearplane:grid
      - name: Remember the browser between runs
        id: pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.63.0-chromium
      - name: A browser to drive the page with
        run: pnpm exec playwright install ${{ steps.pw.outputs.cache-hit == 'true' && ' ' || '--with-deps' }} chromium
      # The rooms seen through the doors (#218), drawn when the site is built (tools/site.cjs runs tools/bake-doorways.mjs).
      - name: Which doorways are to be drawn
        id: doorways
        run: echo "key=$(node tools/bake-doorways.mjs --key)" >> "$GITHUB_OUTPUT"
      - name: Remember drawn doorways between runs
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/doorways
          key: doorways-t00-${{ steps.doorways.outputs.key }}
          restore-keys: doorways-t00-
      # The stairs and the low drop are `quick` in pages.yml since #308 and stop the publication; not repeated here.
      - name: The pause menu whole in every language
        run: node tests/e2e/run.cjs menufit
      - name: Keep the report and the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: tools/out/
          retention-days: 14
          if-no-files-found: ignore

  # Every scenario, once a night and when asked: the machines take a share of the list each, made by tests/e2e/shards.cjs from the
  # last measured time of every scenario (tests/e2e/durations.json; `node tests/e2e/shards.cjs update <reports>` refreshes them after a run), so
  # that none runs much longer than another: taken in turn, four machines ran 35 to 48 minutes of the same list. Asked for by name, the
  # scenarios named are run on the first machine alone.
  # How many machines the list needs is worked out here, by the same plan the machines use (tests/e2e/shards.cjs, #376): the fewest, twelve at
  # least, that keep the longest share within its budget, so a new scenario adds a machine instead of stopping the unit tests.
  shards:
    if: github.event_name != 'push' && github.event.inputs.runner != 't4'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: plan
        run: node tests/e2e/shards.cjs matrix >> "$GITHUB_OUTPUT"

  full:
    needs: shards
    if: github.event_name != 'push' && github.event.inputs.runner != 't4'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.shards.outputs.matrix) }}
    steps:
      - name: Is there anything for this machine
        id: mine
        run: echo "run=${{ (github.event.inputs.scenarios == '' || github.event.inputs.scenarios == null || matrix.shard == 1) && 'true' || 'false' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.mine.outputs.run == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.mine.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.mine.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.mine.outputs.run == 'true'
      # A nightly run stands on its own, with no publication beside it: the quick checks go with the first machine.
      - name: Parse, types, unit tests, and his body against everything built
        if: steps.mine.outputs.run == 'true' && matrix.shard == 1
        run: pnpm run check && pnpm run typecheck && pnpm test && pnpm run test:grid && pnpm run edges && pnpm run edges:grid
      - name: Remember the browser between runs
        if: steps.mine.outputs.run == 'true'
        id: pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.63.0-chromium
      - name: A browser to drive the page with
        if: steps.mine.outputs.run == 'true'
        run: pnpm exec playwright install ${{ steps.pw.outputs.cache-hit == 'true' && ' ' || '--with-deps' }} chromium
      - name: Which doorways are to be drawn
        if: steps.mine.outputs.run == 'true'
        id: doorways
        run: echo "key=$(node tools/bake-doorways.mjs --key)" >> "$GITHUB_OUTPUT"
      - name: Remember drawn doorways between runs
        if: steps.mine.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/doorways
          key: doorways-t00-${{ steps.doorways.outputs.key }}
          restore-keys: doorways-t00-
      - name: Walk the whole temple
        if: steps.mine.outputs.run == 'true'
        env:
          SCENARIOS: ${{ github.event.inputs.scenarios }}
        run: |
          if [ -n "$SCENARIOS" ]; then node tests/e2e/run.cjs $SCENARIOS; else node tests/e2e/run.cjs --shard=${{ matrix.shard }}/${{ needs.shards.outputs.count }}; fi
      # Read after the scenarios, and whatever they gave: a read of the public address that timed out once stood before
      # them and left the first machine's quarter of the scenarios unwalked (#276).
      # The evidence kept outside git (#223): every manifest entry fetched back and its SHA-256 compared. Over the
      # network, so only in the nightly run and when a run by hand asks for it (`evidence`), never in the way of a merge:
      # a branch's run by hand went red on a read of the public address that timed out (#276, #296), which says nothing
      # of the branch. A real mismatch is still found every night.
      # Two stores (#247): the original (Hugging Face, `fallback`) and the copy readers use (`base`, R2). The bucket is read
      # over its S3 interface with the repository's secrets; the public domain is read too, a read it answers with
      # Cloudflare's verification page being hashed from the original instead. If they disagree, the original is right
      # and the copy is mirrored again (`node tools/evidence.mjs mirror`).
      - name: The bucket holds what the manifests say (S3)
        if: ${{ !cancelled() && steps.mine.outputs.run == 'true' && matrix.shard == 1 && (github.event_name == 'schedule' || github.event.inputs.evidence == 'true') }}
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: node tools/evidence.mjs verify-store
      - name: The evidence at the public address is what the manifests say
        if: ${{ !cancelled() && steps.mine.outputs.run == 'true' && matrix.shard == 1 && (github.event_name == 'schedule' || github.event.inputs.evidence == 'true') }}
        run: node tools/evidence.mjs verify --all
      - name: The evidence in the original store is what the manifests say
        if: ${{ !cancelled() && steps.mine.outputs.run == 'true' && matrix.shard == 1 && (github.event_name == 'schedule' || github.event.inputs.evidence == 'true') }}
        run: EVIDENCE_BASE="$(node -p 'require("./tools/evidence.config.json").fallback')" node tools/evidence.mjs verify --all
      - name: Keep the report, the screenshots and the photograph
        if: always() && steps.mine.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-full-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: tools/out/
          retention-days: 14
          if-no-files-found: ignore

  # The same suite on a graphics card (#335, docs/RELEASING.md): only when asked for by hand with `runner: t4`, never by a push,
  # a pull request (this workflow has no pull_request trigger, so a fork cannot reach the token) or the nightly run until the
  # owner says so. The site and the checkout are built and packed once, each of four shards sends the archive to a private
  # Hugging Face bucket and starts a Job on a T4 that walks its share (tools/ci/t4-launch.sh, t4-job.sh, drawing through Vulkan:
  # a browser that fell back to software fails the run, so a T4 run is never a free-machine run under another name). The Job's
  # address is in the log; a Job that fails to start, errors, times out or is cancelled, or comes back with no report, makes the
  # shard red. Cancelling the run cancels the Jobs. The token is the repository secret HF_TOKEN and is read by the launch step only.
  t4-pack:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 't4'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Remember the browser between runs
        id: pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.63.0-chromium
      - name: A browser to bake the doorways with
        run: pnpm exec playwright install ${{ steps.pw.outputs.cache-hit == 'true' && ' ' || '--with-deps' }} chromium
      - name: Which doorways are to be drawn
        id: doorways
        run: echo "key=$(node tools/bake-doorways.mjs --key)" >> "$GITHUB_OUTPUT"
      - name: Remember drawn doorways between runs
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/doorways
          key: doorways-t00-${{ steps.doorways.outputs.key }}
          restore-keys: doorways-t00-
      - name: Build the site and pack it with the checkout
        run: T4_PACK_ONLY="$RUNNER_TEMP/t4-pack.tgz" tools/ci/t4-launch.sh pack
      - uses: actions/upload-artifact@v4
        with:
          name: t4-pack-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/t4-pack.tgz
          retention-days: 1

  # What shard 1 of `full` does before its scenarios, on a free machine beside the Jobs.
  t4-checks:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 't4'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Parse, types, unit tests, and his body against everything built
        run: pnpm run check && pnpm run typecheck && pnpm test && pnpm run test:grid && pnpm run edges && pnpm run edges:grid
      - name: The evidence in the stores is what the manifests say
        if: ${{ !cancelled() && github.event.inputs.evidence == 'true' }}
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: node tools/evidence.mjs verify-store && node tools/evidence.mjs verify --all && EVIDENCE_BASE="$(node -p 'require("./tools/evidence.config.json").fallback')" node tools/evidence.mjs verify --all

  t4:
    needs: t4-pack
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 't4'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: t4-pack-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}
      - name: The hf command
        run: pip install --quiet huggingface_hub
      - name: Walk this shard's scenarios on a T4
        # Scenarios named by hand go to the first shard alone, as on the free machines.
        if: ${{ github.event.inputs.scenarios == '' || github.event.inputs.scenarios == null || matrix.shard == 1 }}
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          T4_PACK: ${{ runner.temp }}/t4-pack.tgz
          SCENARIOS: ${{ github.event.inputs.scenarios }}
        run: |
          set -o pipefail
          if [ -n "$SCENARIOS" ]; then tools/ci/t4-launch.sh $SCENARIOS; else tools/ci/t4-launch.sh --shard=${{ matrix.shard }}/4; fi 2>&1 | tee "$RUNNER_TEMP/t4.log"
      - name: What it took
        if: always()
        shell: bash
        run: node tools/ci/t4-summary.cjs tools/out >> "$GITHUB_STEP_SUMMARY" || true
      - name: Keep the report, the screenshots and the Job's log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-t4-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: tools/out/
          retention-days: 14
          if-no-files-found: ignore

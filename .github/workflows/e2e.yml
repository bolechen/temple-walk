name: End to end, every scenario

# The whole suite takes the better part of an hour without a GPU, so it does not run on every push:
# once a week, and whenever it is asked for (Actions → this workflow → Run workflow).
on:
  # Beside every publication, and not in its way: the stairs and the low drop, about three minutes, because walking and
  # collision change most often. The photograph's interface (photo-ui, several minutes on its own) breaks only when the
  # photograph is changed; it waits for the weekly run or a run asked for by hand.
  push:
    branches: [main]
    paths: ["app/**", "tests/e2e/**", "package.json", "pnpm-lock.yaml"]
  workflow_dispatch:
    inputs:
      scenarios:
        description: "Scenario names separated by spaces, or --smoke; empty runs them all"
        required: false
        default: ""
  schedule:
    - cron: "17 19 * * 6"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event_name == 'push' && 'regression' || 'full' }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check && pnpm test
      - name: His whole body fits everywhere his feet may go
        run: pnpm run edges
      - name: Remember the browser between runs
        id: pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.63.0-chromium
      - name: A browser to drive the page with
        run: pnpm exec playwright install ${{ steps.pw.outputs.cache-hit == 'true' && ' ' || '--with-deps' }} chromium
      - name: Walk the whole temple
        env:
          SCENARIOS: ${{ github.event_name == 'push' && 'stairs drop' || github.event.inputs.scenarios }}
        run: node tests/e2e/run.cjs $SCENARIOS
      - name: Keep the report, the screenshots and the photograph
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-full-${{ github.run_id }}-${{ github.run_attempt }}
          path: tools/out/
          retention-days: 14
          if-no-files-found: ignore

name: Remove the pull request's preview

# A closed pull request (merged or not) no longer needs its preview (docs/PREVIEWS.md). Cloudflare would in time drop
# the oldest previews by itself (100 per Worker on the free plan); this keeps the list to open pull requests.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  remove:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/preview
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Delete the preview and its deployments
        id: delete
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
          PR: ${{ github.event.pull_request.number }}
        run: |
          out=$(npx --yes wrangler@4.162.0 preview delete --worker-name temple-walk-preview --name "pr-$PR" -y 2>&1) && { echo "$out" | tail -3; exit 0; }
          echo "$out" | tail -5
          # A pull request that never had a preview (documents only, or a failed check) has nothing to delete.
          echo "$out" | grep -qiE 'not found|does not exist|no preview' && { echo "nothing to delete"; echo "none=true" >> "$GITHUB_OUTPUT"; exit 0; }
          exit 1
      - name: Say so on the pull request
        if: steps.delete.outcome == 'success' && steps.delete.outputs.none != 'true'
        uses: actions/github-script@v7
        env:
          STATE: removed
        with:
          script: await require(`${process.env.GITHUB_WORKSPACE}/tools/preview/comment.cjs`)({ github, context, core })

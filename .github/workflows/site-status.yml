name: Sync T00 status to research Site
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Verify and deploy to GitHub Pages]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: site-status
  cancel-in-progress: false
jobs:
  sync:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Always use trusted CURRENT main; never execute downloaded workflow artifacts.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate status logic
        run: node --test tests/unit/site-status.test.mjs
      - name: Generate status from GitHub results
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/status/build.mjs
      - name: Publish machine-readable status
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('tools/out/status/t00.json', 'utf8');
            const {owner, repo} = context.repo;
            // A push can arrive while this run is working. Its queued run will publish fresh data.
            const main = await github.rest.git.getRef({owner,repo,ref:'heads/main'});
            if (main.data.object.sha !== JSON.parse(content).source.sha) {
              core.notice('Main moved; leave publication to the queued newer run.'); return;
            }
            let parent;
            try {parent=(await github.rest.git.getRef({owner,repo,ref:'heads/site-status'})).data.object.sha;}
            catch(e){if(e.status!==404)throw e;}
            const tree=(await github.rest.git.createTree({owner,repo,tree:[{path:'status/t00.json',mode:'100644',type:'blob',content}]})).data.sha;
            const commit=(await github.rest.git.createCommit({owner,repo,tree,parents:parent?[parent]:[],message:'chore(status): sync T00 delivery and verification'})).data.sha;
            if(parent) await github.rest.git.updateRef({owner,repo,ref:'heads/site-status',sha:commit,force:false});
            else await github.rest.git.createRef({owner,repo,ref:'refs/heads/site-status',sha:commit});
            core.summary.addLink('T00 status JSON','https://raw.githubusercontent.com/bolechen/temple-walk/site-status/status/t00.json').write();
